[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fornma"
description = "A tool for single cell image analysis and phenotype integration"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.13"
license = {text = "BSD-3-Clause"}
keywords = ["fornma", "NMA", "single cell", "nuclei", "phenotype"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "numpy>=1.26,<2.0; python_version<'3.12'",
  "numpy>=2.0,<3.0; python_version>='3.12'",
  "scipy>=1.13,<2.0",
  "pandas>=2.1,<3.0",
  "matplotlib>=3.5,<4.0",
  "seaborn>=0.12,<0.14",
  "scikit-image>=0.20,<0.26",
  "scikit-learn>=1.4,<2.0",
  "networkx>=3.0,<4.0",
  "pillow>=10.0,<12.0",
  "opencv-python>=4.5,<5.0",
  "cellpose<4",
  "umap-learn>=0.5.5,<0.6",
  "pingouin>=0.5,<0.6",
  "scikit-posthocs>=0.11,<0.12",
  "statsmodels>=0.13,<1.0",
  "shapely>=2.0,<3.0",
  "pystackreg>=0.2,<0.3",
  "plotly>=5.22",
  "progress>=1.6,<2.0",
  "rich>=13,<14",
  "toml>=0.10,<0.11",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest~=8.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[project.scripts]
fornma = "fornma.cli:main"            # já existe, manter

[tool.setuptools.package-data]
fornma = ["resources/*.toml"]
