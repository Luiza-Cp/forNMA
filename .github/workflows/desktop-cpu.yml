name: Desktop CPU installers
on:
  workflow_dispatch:
  push:
    branches: [build/desktop-cpu]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/public/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-cpu.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build and test CPU installer
        run: python packaging/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: forNMA-cpu-${{ runner.os }}-x64
          path: release/
          if-no-files-found: error
          retention-days: 14
