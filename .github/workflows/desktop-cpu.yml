name: Desktop CPU installers
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options: [all, macos]
  push:
    branches: [build/desktop-cpu]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/public/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-cpu.yml'
      - '.gitignore'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create draft for tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "desktop-cpu-${{ github.run_id }}"
          --draft --target "${{ github.sha }}"
          --title "Desktop CPU installers (build ${{ github.run_id }})"
          --notes "Test installers. Download the file matching your OS and processor. macOS and Windows packages have no developer signing certificate."
  package:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'macos' && '[{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x64"}]' || '[{"os":"ubuntu-22.04","arch":"x64"},{"os":"windows-2022","arch":"x64"},{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Historical analysis outputs include a directory named "file:",
          # which Windows cannot check out. Only build inputs are needed.
          sparse-checkout: |
            src
            frontend
            packaging
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build and test CPU installer
        run: python packaging/build_desktop.py
      - name: Upload tested installers to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "desktop-cpu-${{ github.run_id }}" release/*
